<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taskflow</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div>
        <p class="subtitle" id="currentDate">TODAY</p>
        <h2>Today's Tasks</h2>
      </div>
      <div class="progress-circle" id="progressText">0%</div>
    </header>

    <!-- Motivational Card -->
    <div class="stats-card">
      <div>
        <p id="statsText">0 of 0 completed</p>
        <span class="quote" id="motivationalText">Keep your momentum going! 🔥</span>
      </div>
      <span class="badge">Focus Mode</span>
    </div>

    <!-- Input Section -->
    <div class="add-task-card">
      <input type="text" id="taskInput" placeholder="Add a new task...">
      <button id="addBtn">+</button>
    </div>

    <!-- Filter Tabs -->
    <div class="filter-tabs">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <!-- Task List -->
    <ul id="taskList"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
